opensearchUrl: "http://elasticsearch:9200"

snapshotRepo: "s3-backup"

madisonKey: ""
osdUrl: ""

dateFormat: "%Y.%m.%d"

maxConcurrentSnapshots: 1

schedules:
  snapshots: "0 2 * * *"
  snapshotschecker: "0 6 * * *"
  snapshotsdelete: "30 3 * * *"

activeDeadlineSeconds: 86400

registrySecret: "registrysecret"

nodeSelector:
  node-role.kubernetes.io/prod-worker: ""

affinity: {}

tolerations:
  - effect: NoExecute
    key: dedicated
    operator: Equal
    value: prod-worker

indicesConfig:
  full_prefix_snapshots: true
  s3_snapshots:
    unit_count:
      all: 5
  indices:
    - kind: prefix
      value: app-alpha-mm
      snapshot: true
      snapshot_count_s3: 5
    - kind: prefix
      value: app-alpha-vk
      snapshot: true
      snapshot_count_s3: 5
    - kind: prefix
      value: app-alpha-ok
      snapshot: true
      snapshot_count_s3: 5
    - kind: prefix
      value: app-alpha-gm
      snapshot: true
      snapshot_count_s3: 5
    - kind: prefix
      value: app-beta
      snapshot: true
      snapshot_count_s3: 5
    - kind: prefix
      value: app-gamma-v2
      snapshot: true
      snapshot_count_s3: 7
    - kind: prefix
      value: app-delta
      snapshot: true
      snapshot_count_s3: 5
    - kind: prefix
      value: app-epsilon
      snapshot: true
      snapshot_count_s3: 5
    - kind: prefix
      value: app-zeta-vk
      snapshot: true
      snapshot_count_s3: 5
